[project]
name = "hercynia_bar_discount_tool"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.12.19",
    "dagster-webserver==1.12.19",
    "dagster-dg-cli==1.12.19",
    "selenium==4.41.0",
]

[dependency-groups]
dev = [
    "dagster-webserver",
    "dagster-dg-cli",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "hercynia_bar_discount_tool"
registry_modules = [
    "hercynia_bar_discount_tool.components.*",
]


